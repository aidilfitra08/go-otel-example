global:
  resolve_timeout: 5m

# The root route on which each incoming alert enters.
route:
  # The root route must not have any matchers as it is the entry point for all alerts
  receiver: 'default-receiver'
  
  # How long to wait before sending a notification again if it has already been sent successfully for an alert
  repeat_interval: 4h
  
  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service', 'job']
  
  # How long to initially wait to send a notification for a group of alerts
  group_wait: 30s
  
  # How long to wait before sending a notification about new alerts that are added to a group of alerts
  group_interval: 5m
  
  # Child routes
  routes:
    # Critical alerts - send immediately
    - match:
        severity: critical
      receiver: 'critical-receiver'
      repeat_interval: 1h
      group_wait: 10s
      
    # Warning alerts - can wait a bit longer
    - match:
        severity: warning
      receiver: 'warning-receiver'
      repeat_interval: 4h

# Inhibition rules allow to mute a set of alerts given that another alert is firing
inhibit_rules:
  # Mute warning if critical alert is firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job', 'instance']

receivers:
