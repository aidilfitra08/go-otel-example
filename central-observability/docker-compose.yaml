version: "3.8"

services:
  tempo:
    image: grafana/tempo:2.10.0
    container_name: tempo-server
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo.yaml
      - ./tempo/tempo-data:/tmp/tempo
    ports:
      - "3200:3200" # tempo http
      - "4317:4317" # otlp grpc
      - "4318:4318" # otlp http
    networks:
      - observability-network

  loki:
    image: grafana/loki:latest
    container_name: loki-server
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki/loki-data:/loki
    networks:
      - observability-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-server
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana/grafana-dashboard-otel.json:/var/lib/grafana/dashboards/otel-dashboard.json
      - ./grafana/grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - observability-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-server
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - observability-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-server
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - observability-network

networks:
  observability-network:
    driver: bridge
    name: observability-network
